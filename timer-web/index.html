<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>静坐计时器</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#B8860B" />
<script src="./desktop-install.js" defer></script>
<script src="./offline-cache.js" defer></script>
<script src="./remote/connection.js?v=2" defer></script>
<script src="./remote/desktop.js?v=2" defer></script>
<style>
  :root {
    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --surface-muted: #F1F3F5;
    --text: #1A1A1A;
    --text-soft: #495057;
    --muted: #868E96;
    --border: #E9ECEF;
    --primary: #B8860B;
    --primary-dark: #936D09;
    --primary-soft: #FFF9E6;
    --danger: #E03131;
    --success: #2F9E44;
    --cast-bg: #0E1116;
    --cast-surface: #1A1F28;
    --cast-text: #F5F7FA;
    --cast-muted: #9AA4B2;
    --shadow: 0 6px 22px rgba(0,0,0,.06);
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    /* phones: keep one-finger scrolling, but block pinch zoom and double-tap zoom */
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  body { display: flex; flex-direction: column; overflow: hidden; }

  button {
    font-family: inherit; cursor: pointer; border: none; background: none;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }

  /* ---------------- App bar ---------------- */
  .appbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 5;
  }
  .appbar .brand { font-size: 18px; font-weight: 800; letter-spacing: .5px; color: var(--primary); }
  .appbar .spacer { flex: 1; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 48px;
    padding: 0 18px;
    border-radius: 12px;
    background: var(--surface-muted);
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 700;
    transition: transform .08s ease, background .2s ease, color .2s ease;
  }
  .icon-btn:hover { background: #E5E7EB; }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.primary { background: var(--primary); color: #fff; }
  .icon-btn.primary:hover { background: var(--primary-dark); }
  .icon-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .icon-btn.sound-toggle { width: 48px; flex: none; justify-content: center; padding: 0; font-size: 20px; }
  .sound-toggle[aria-pressed="true"] { background: var(--primary-soft); }
  .sound-toggle[aria-pressed="true"]:hover { background: #F9EDC6; }
  #desktopInstallBtn { display: none; }
  @media (min-width: 768px) and (hover: hover) {
    #desktopInstallBtn:not([hidden]) { display: inline-flex; }
  }
  @media (display-mode: standalone) {
    #desktopInstallBtn { display: none !important; }
  }
  .install-help {
    width: min(460px, calc(100vw - 32px));
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .install-help::backdrop { background: rgba(0, 0, 0, .4); }
  .install-help h2 { margin: 0 0 16px; font-size: 20px; }
  .install-help p { line-height: 1.7; color: var(--text-soft); }
  .install-help a { color: var(--primary-dark); }
  .install-help form { display: flex; justify-content: flex-end; margin-top: 20px; }
  #remoteToggle[hidden], #remoteQr[hidden], #remoteDialog button[hidden] { display: none; }
  #remoteToggle[data-connected="true"] .dot { color: var(--success); }
  #remoteDialog { max-height: calc(100dvh - 24px); overflow: auto; }
  #remoteDialog form { gap: 8px; flex-wrap: wrap; }
  #remoteQr { display: block; width: min(100%, 224px); height: auto; margin: 16px auto 0; border-radius: 12px; }
  #remoteExpiry { margin: 8px 0 0; text-align: center; font-size: 13px; }
  @media (max-width: 639px) {
    #remoteToggle { display: none; }
  }

  /* ---------------- Normal mode ---------------- */
  .normal-view {
    flex: 1;
    display: flex;
    padding: 24px 20px;
    overflow: auto;
  }
  .normal-card {
    width: 100%;
    max-width: 440px;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .dial {
    position: relative;
    width: 280px; height: 280px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .dial:active { transform: scale(.985); }
  .dial-hint {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    color: var(--muted); font-size: 13px; font-weight: 800;
    letter-spacing: .5px; opacity: .55; transition: opacity .2s ease, color .2s ease;
    pointer-events: none;
  }
  .dial:hover .dial-hint { opacity: 1; color: var(--primary); }
  .dial .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .dial .ring circle { fill: none; stroke-width: 10; }
  .dial .ring .track { stroke: var(--primary-soft); }
  .dial .ring .fill {
    stroke: var(--primary);
    stroke-linecap: round;
  }
  .dial .face {
    position: absolute; inset: 16px; border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .dial .glow {
    position: absolute; inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,134,11,.20), rgba(184,134,11,0) 70%);
    opacity: 0;
    transition: opacity .4s ease;
  }
  .dial.running .glow { opacity: 1; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  .time-text {
    font-size: 64px; font-weight: 800; letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .cast-entry {
    width: 100%; max-width: 340px; height: 58px;
    border-radius: 16px;
    background: var(--primary); color: #fff;
    font-size: 18px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: var(--shadow);
    transition: transform .08s ease, background .2s ease;
  }
  .cast-entry:hover { background: var(--primary-dark); }
  .cast-entry:active { transform: scale(.97); }
  .cast-entry .ic { font-size: 20px; line-height: 1; }

  .panel {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .label-soft { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .preset-heading { margin-bottom: 10px; }

  .duration-heading { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .duration-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .duration-field { display: flex; align-items: center; gap: 8px; color: var(--text-soft); font-weight: 700; }
  .duration-wheel {
    --row-height: 28px;
    --wheel-padding: var(--row-height);
    flex: 1;
    min-width: 0;
    height: calc(var(--row-height) + 2 * var(--wheel-padding));
    padding-block: var(--wheel-padding);
    overflow: hidden auto;
    overscroll-behavior-y: contain;
    scroll-snap-type: y mandatory;
    scroll-padding-block: var(--wheel-padding);
    scrollbar-width: none;
    border-radius: 12px;
    background: linear-gradient(
      var(--surface-muted) var(--wheel-padding),
      var(--primary-soft) var(--wheel-padding) calc(100% - var(--wheel-padding)),
      var(--surface-muted) calc(100% - var(--wheel-padding))
    );
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  .duration-wheel::-webkit-scrollbar { display: none; }
  .duration-wheel:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .duration-wheel.dragging { scroll-snap-type: none; cursor: grabbing; }
  .duration-wheel[aria-disabled="true"] { overflow: hidden; opacity: .5; cursor: default; }
  .duration-option {
    display: grid;
    place-items: center;
    height: var(--row-height);
    scroll-snap-align: center;
    color: var(--muted);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .duration-option.selected { color: var(--primary-dark); font-size: 22px; font-weight: 800; }

  .presets { display: flex; gap: 10px; flex-wrap: nowrap; }
  .preset {
    flex: 1 1 0; min-width: 0; height: 58px;
    border-radius: 12px;
    background: var(--surface-muted);
    color: var(--text-soft);
    font-size: 17px; font-weight: 800;
    border: 1.5px solid transparent;
    transition: all .15s ease;
  }
  .preset.selected { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .preset:disabled { opacity: .4; cursor: not-allowed; }

  .info-grid { display: flex; gap: 12px; }
  .info-card {
    flex: 1; text-align: center;
    background: var(--surface-muted); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .info-card .k { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  .info-card .v { font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 10px; width: 100%; }
  .act {
    height: 66px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 18px; font-weight: 800;
    transition: transform .08s ease, opacity .2s ease;
  }
  .act:active { transform: scale(.97); }
  .act.secondary {
    width: 72px; flex-shrink: 0; background: var(--surface);
    box-shadow: var(--shadow); color: var(--text-soft); font-size: 22px;
  }
  .act.main { flex: 1; background: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .act.main:hover:not(:disabled) { background: var(--primary-dark); }
  .act .icon { font-size: 22px; line-height: 1; }
  .act:disabled, .cast-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------------- Cast mode ---------------- */
  .cast-view {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vmin;
    /* bottom padding keeps the toolbar from overlapping the start/end line on short screens */
    padding: 4vmin 4vmin max(18vmin, 104px);
    background: var(--cast-bg);
    color: var(--cast-text);
    z-index: 100;
    user-select: none;
    overflow: hidden;
  }
  body.casting .cast-view { display: flex; }
  body.casting .normal-view, body.casting .appbar { display: none; }

  .cast-title {
    font-size: 5.6vmin;
    font-weight: 800;
    color: var(--cast-muted);
    text-align: center;
    outline: none;
    max-width: 86vw;
    line-height: 1.2;
    padding: 0 6px;
    border-radius: 10px;
  }
  .cast-title:focus { color: var(--cast-text); background: rgba(255,255,255,.06); }
  .cast-title:empty::before { content: "倒计时"; color: var(--cast-muted); }

  .cast-dial {
    position: relative;
    width: min(66vmin, 58vh); height: min(66vmin, 58vh);
    display: flex; align-items: center; justify-content: center;
  }
  .cast-dial .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .cast-dial .ring circle { fill: none; stroke-width: 1.6; }
  .cast-dial .ring .track { stroke: rgba(255,255,255,.08); }
  .cast-dial .ring .fill {
    stroke: var(--primary);
    stroke-linecap: round;
  }
  .cast-dial .glow {
    position: absolute; inset: -4%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,134,11,.28), rgba(184,134,11,0) 70%);
    opacity: 0; transition: opacity .4s ease;
  }
  .cast-dial.running .glow { opacity: 1; animation: cast-breathe 3s ease-in-out infinite; }
  @keyframes cast-breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .cast-dial .center {
    display: flex; flex-direction: column; align-items: center; gap: 2vmin; line-height: 1;
  }
  .cast-time {
    font-size: 18vmin; font-weight: 800; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .cast-status { font-size: 3.4vmin; font-weight: 800; color: var(--cast-muted); letter-spacing: .2em; }

  .cast-meta { font-size: 2.6vmin; color: var(--cast-muted); font-variant-numeric: tabular-nums; }
  .cast-meta b { color: var(--cast-text); font-weight: 700; }

  .cast-done {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 0 5vw;
    text-align: center;
    background: radial-gradient(circle at 50% 46%, rgba(224,49,49,.42) 0%, rgba(16,19,25,.72) 42%, rgba(8,10,14,.96) 72%);
    z-index: 3;
  }
  .cast-done.show { display: flex; }
  /* pulsing red halo behind the message */
  .cast-done::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 46%, rgba(224,49,49,.5), rgba(224,49,49,0) 58%);
    animation: done-flash 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  .cast-done .big {
    position: relative;
    font-size: min(22vw, 30vh);
    font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 0 6vmin rgba(224,49,49,.45);
  }
  @keyframes done-flash { 0%,100%{opacity:1} 50%{opacity:.4} }
  /* when the countdown is over, the alert replaces the digits and the ring turns red */
  .cast-dial.done .center { opacity: 0; }
  .cast-title, .cast-meta { transition: opacity .3s ease; }
  .cast-view.done .cast-title, .cast-view.done .cast-meta { opacity: 0; }
  .cast-dial.done .ring .track { stroke: rgba(224,49,49,.5); }
  .cast-dial.done .glow {
    opacity: 1;
    background: radial-gradient(circle, rgba(224,49,49,.32), rgba(224,49,49,0) 70%);
    animation: done-flash 1.6s ease-in-out infinite;
  }

  .cast-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 1.8vmin;
    flex-wrap: wrap;
    padding: 3vmin 4vmin calc(3vmin + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(10,12,16,.85), rgba(10,12,16,0));
    transition: opacity .3s ease, transform .3s ease;
  }
  .cast-btn {
    height: 9vmin; min-height: 60px; padding: 0 3.4vmin; border-radius: 1.6vmin;
    background: rgba(255,255,255,.1); color: var(--cast-text);
    font-size: 2.6vmin; font-weight: 800;
    display: inline-flex; align-items: center; gap: .8vmin;
    transition: background .2s ease, transform .1s ease;
  }
  .cast-btn:hover { background: rgba(255,255,255,.18); }
  .cast-btn:active { transform: scale(.96); }
  .cast-btn.gold { background: var(--primary); color: #fff; }
  .cast-btn.gold:hover { background: var(--primary-dark); }
  .cast-btn .ic { font-size: 2.8vmin; }

  /* fullscreen cue */
  #fullscreenPrompt {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,.75); color: #fff;
    text-align: center; font-size: 14px; font-weight: 700;
    padding: 10px; z-index: 200; display: none;
  }

  /* ---- Mobile / small screens ---- */
  @media (max-width: 767px) {
    .cast-entry, .dial-hint { display: none; }
    /* mobile browsers have no fullscreen concept */
    #castFullscreen { display: none; }
    /* fixed 3-column grid for the remaining 6 cast buttons (2 rows x 3) */
    .cast-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: stretch;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      background: rgba(10,12,16,.92);
    }
    .cast-btn {
      width: 100%;
      height: 58px;
      min-height: 50px;
      padding: 0;
      border-radius: 14px;
      font-size: 15px;
      justify-content: center;
      gap: 6px;
    }
    .cast-btn .ic { font-size: 16px; }
  }
  @media (max-width: 480px) {
    .appbar { gap: 8px; padding-inline: 12px; }
    .appbar .brand { font-size: 16px; }
    .appbar .icon-btn { height: 44px; padding-inline: 12px; }
    .appbar .sound-toggle { width: 44px; padding-inline: 0; }
    .normal-card { gap: 16px; }
    .presets { gap: 6px; }
    .preset { font-size: 15px; }
    .dial { width: 220px; height: 220px; }
    .dial .face { inset: 12px; }
    .dial .ring circle { stroke-width: 8; }
    .time-text { font-size: 50px; letter-spacing: -1px; }
    .dial .glow { inset: -14px; }
    .panel { padding: 16px; gap: 14px; }
    .actions { gap: 8px; }
    .act.secondary { width: clamp(44px, 15vw, 64px); }
    .act.main { font-size: 16px; white-space: nowrap; }
  }
  @media (min-width: 960px), (min-width: 640px) and (orientation: landscape) {
    .appbar { padding-block: 8px; padding-inline: max(20px, calc((100% - 1160px) / 2)); }
    .appbar .icon-btn { height: 44px; }
    .appbar .sound-toggle { width: 44px; }
    .normal-view { padding: clamp(10px, 3dvh, 28px) clamp(18px, 4vw, 40px); }
    .normal-card {
      max-width: 1160px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(320px, 44vw, 440px);
      grid-template-rows: auto auto;
      column-gap: clamp(24px, 5vw, 64px);
      row-gap: clamp(8px, 2.2dvh, 18px);
      align-items: center;
    }
    .normal-card > .dial {
      grid-column: 1;
      grid-row: 1 / 3;
      justify-self: center;
      width: min(100%, 480px, calc(100dvh - 120px));
      height: auto;
      aspect-ratio: 1;
      container-type: inline-size;
    }
    .normal-card > .dial .ring { width: 100%; height: 100%; }
    .normal-card > .dial .time-text { font-size: clamp(32px, 19cqi, 92px); }
    .normal-card > .dial .face { inset: clamp(8px, 3.5cqi, 16px); }
    .normal-card > .dial .dial-hint { bottom: clamp(10px, 6cqi, 26px); }
    .normal-card > .panel {
      grid-column: 2;
      grid-row: 1;
      align-self: end;
      padding: clamp(10px, 2.8dvh, 20px);
      gap: clamp(8px, 2.4dvh, 16px);
    }
    .normal-card > .actions { grid-column: 2; grid-row: 2; align-self: start; }
    .normal-card > .cast-entry { display: none; }
    .normal-card .preset { height: clamp(36px, 7.5dvh, 52px); }
    .normal-card .act { height: clamp(44px, 8.5dvh, 60px); }
    .normal-card .act.secondary { width: clamp(52px, 6vw, 68px); }
  }
  @media (min-width: 640px) and (max-height: 480px) {
    .appbar { padding-block: 5px; }
    .appbar .icon-btn { height: clamp(32px, 12dvh, 38px); }
    .appbar .sound-toggle { width: clamp(32px, 12dvh, 38px); }
    .normal-view { padding-block: clamp(3px, calc((100dvh - 280px) / 6), 6px); }
    .normal-card > .panel { padding-block: clamp(6px, 2dvh, 8px); }
    .normal-card .preset { height: clamp(30px, 11.25dvh, 36px); }
    .normal-card .act { height: clamp(36px, 13dvh, 44px); }
    .duration-wheel { --wheel-padding: clamp(10px, calc((100dvh - 250px) / 5), 24px); }
    .duration-heading, .preset-heading { margin-bottom: 6px; }
    .info-card {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 4px;
    }
    .info-card .k { font-size: 12px; }
    .info-card .v { font-size: 14px; }
  }
</style>
</head>
<body>
  <div id="fullscreenPrompt">点击“进入全屏”或按 F 键可让计时器铺满整块大屏</div>

  <header class="appbar">
    <span class="brand">⏱ 静坐计时器</span>
    <div class="spacer"></div>
    <button id="desktopInstallBtn" class="icon-btn" type="button">添加到桌面</button>
    <button id="remoteToggle" class="icon-btn" type="button" hidden><span class="dot"></span>手机遥控</button>
    <button id="soundBtn" class="icon-btn sound-toggle" type="button" title="音效开关"
      aria-label="音效开关" aria-pressed="true">🔊</button>
    <button id="castToggle" class="icon-btn primary"><span class="dot"></span>大屏模式</button>
  </header>
  <dialog id="desktopInstallHelp" class="install-help" aria-labelledby="desktopInstallTitle">
    <h2 id="desktopInstallTitle">添加到桌面</h2>
    <p id="desktopInstallInstructions">点击地址栏的安装图标，或在浏览器菜单中查找“安装此网站”“安装应用”或“创建快捷方式”。不同浏览器的选项名称可能略有不同。</p>
    <form method="dialog"><button class="icon-btn primary" type="submit">知道了</button></form>
  </dialog>
  <dialog id="remoteDialog" class="install-help" aria-labelledby="remoteTitle">
    <h2 id="remoteTitle">手机遥控</h2>
    <p id="remoteStatus" role="status"></p>
    <img id="remoteQr" alt="手机遥控配对二维码" width="224" height="224" hidden>
    <p id="remoteExpiry" hidden></p>
    <form method="dialog">
      <button id="remoteRenew" class="icon-btn" type="button" hidden>重新生成</button>
      <button id="remoteEnd" class="icon-btn" type="button" hidden>结束遥控</button>
      <button class="icon-btn primary" type="submit">关闭</button>
    </form>
  </dialog>

  <!-- NORMAL MODE -->
  <main class="normal-view">
    <div class="normal-card">
      <div class="dial" id="dial" role="button" tabindex="0" aria-label="进入大屏模式" title="点击进入大屏模式">
        <svg class="ring" viewBox="0 0 280 280">
          <circle class="track" cx="140" cy="140" r="132" />
          <circle class="fill" cx="140" cy="140" r="132" />
        </svg>
        <div class="glow"></div>
        <div class="face">
          <div class="time-text" id="timeText">05:00</div>
          <div class="dial-hint">⛶ 点击进入大屏</div>
        </div>
      </div>

      <button class="cast-entry" id="castEntry"><span class="ic">⛶</span>大屏模式</button>

      <div class="panel">
        <div>
          <div class="duration-heading">
            <span class="label-soft">设置时长</span>
            <span class="label-soft" id="durationHint">上下滑动</span>
          </div>
          <div class="duration-picker" role="group" aria-label="设置时长">
            <div class="duration-field">
              <div class="duration-wheel" id="minuteWheel" role="spinbutton" tabindex="0"
                aria-label="分钟" aria-describedby="durationHint" aria-valuemin="0"></div>
              <span aria-hidden="true">分</span>
            </div>
            <div class="duration-field">
              <div class="duration-wheel" id="secondWheel" role="spinbutton" tabindex="0"
                aria-label="秒钟" aria-describedby="durationHint" aria-valuemin="0"></div>
              <span aria-hidden="true">秒</span>
            </div>
          </div>
        </div>
        <div>
          <div class="label-soft preset-heading">快捷预设</div>
          <div class="presets" id="presets">
            <button class="preset" data-min="5">5m</button>
            <button class="preset" data-min="10">10m</button>
            <button class="preset" data-min="25">25m</button>
            <button class="preset" data-min="40">40m</button>
          </div>
        </div>
        <div class="info-grid">
          <div class="info-card"><div class="k">开始时间</div><div class="v" id="startInfo">--:--:--</div></div>
          <div class="info-card"><div class="k">预计结束</div><div class="v" id="endInfo">--:--:--</div></div>
        </div>
      </div>

      <div class="actions">
        <button id="resetBtn" class="act secondary" title="重置"><span class="icon">↺</span></button>
        <button id="minusBtn" class="act secondary" title="减少 1 分钟">−1</button>
        <button id="mainBtn" class="act main"><span class="icon">▶</span><span id="mainLabel">开始计时</span></button>
        <button id="addBtn" class="act secondary" title="增加 1 分钟">+1</button>
      </div>
    </div>
  </main>

  <!-- CAST MODE -->
  <section class="cast-view" id="castView">
    <div id="castTitle" class="cast-title" contenteditable="true" spellcheck="false">倒计时</div>

    <div class="cast-dial" id="castDial">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="47" />
        <circle class="fill" cx="50" cy="50" r="47" />
      </svg>
      <div class="glow"></div>
      <div class="center">
        <div class="cast-time" id="castTime">05:00</div>
        <div class="cast-status" id="castStatus">准备</div>
      </div>
      <div class="cast-done" id="castDone">
        <div class="big">时间到！</div>
      </div>
    </div>

    <div class="cast-meta" id="castMeta">开始 <b>--:--</b> · 结束 <b>--:--</b></div>

    <div class="cast-controls" id="castControls">
      <button class="cast-btn gold" id="castMain"><span class="ic">▶</span><span id="castMainLabel">开始</span></button>
      <button class="cast-btn" id="castMinus"><span class="ic">−</span>1 分钟</button>
      <button class="cast-btn" id="castAdd"><span class="ic">+</span>1 分钟</button>
      <button class="cast-btn" id="castReset">↺ 重置</button>
      <button class="cast-btn" id="castSound">🔊 声音</button>
      <button class="cast-btn" id="castFullscreen">⛶ 全屏</button>
      <button class="cast-btn" id="castExit">退出大屏</button>
    </div>
  </section>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const secondMs = 1000;
  const secondsPerMinute = 60;
  const minuteMs = secondsPerMinute * secondMs;
  const maxMinutes = 999;
  const maxDuration = (maxMinutes + 1) * secondsPerMinute - 1;

  const state = {
    durationSeconds: 5 * secondsPerMinute,
    remainingMs: 5 * minuteMs,
    running: false,
    startedAt: null,
    endsAt: null,
    soundEnabled: true,
    castTitleReady: true,
    lastTickSec: null,
    finishPlayed: false,
    doneVisible: false,
  };
  let remote;

  const C = 2 * Math.PI * 132;          // normal ring circumference
  const CCAST = 2 * Math.PI * 47;       // cast ring circumference

  /* ---------- audio ---------- */
  const SOUND_FILES = {
    prompt: 'sounds/timer-prompt.wav',
    tick: 'sounds/timer-tick.wav',
    ring: 'sounds/timer-ring.wav',
    voice: 'sounds/timer-add-minute-voice.wav',
    subMinute: 'sounds/timer-subtract-minute-voice-yunyang-10.wav',
  };
  const useDecodedAudio = location.protocol === 'https:' || location.protocol === 'http:';
  const soundData = new Map();
  const decodedSounds = new Map();
  const mediaSounds = new Map();
  const playingSounds = new Map();
  let actx = null;
  let audioReady = null;

  async function fetchSound(cue) {
    try {
      const response = await fetch(SOUND_FILES[cue]);
      return response.ok ? await response.arrayBuffer() : null;
    } catch {
      return null;
    }
  }

  function loadSounds() {
    const decode = useDecodedAudio && (window.AudioContext || window.webkitAudioContext);
    for (const cue of Object.keys(SOUND_FILES)) {
      if (decode) soundData.set(cue, fetchSound(cue));
      else getMedia(cue).load();
    }
  }

  async function decodeSound(context, cue) {
    const prefetched = soundData.get(cue);
    soundData.delete(cue);
    const bytes = (await prefetched) || await fetchSound(cue);
    return bytes ? context.decodeAudioData(bytes) : null;
  }

  function unlockAudio(event) {
    if (!state.soundEnabled || (event && !event.isTrusted)) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    try {
      // Delayed cues share the context resumed during the user's gesture.
      if (!actx) actx = new AudioContext();
      audioReady = actx.state === 'running'
        ? Promise.resolve(true)
        : actx.resume().then(() => true, () => false);
    } catch {
      audioReady = null;
    }
  }
  ['touchend', 'click', 'keydown'].forEach((ev) => {
    document.addEventListener(ev, unlockAudio, { capture: true, passive: true });
  });

  function tone(freq, dur, delay, vol) {
    const c = actx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    const t = c.currentTime + (delay || 0);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.2));
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + (dur || 0.2) + 0.05);
  }
  async function synth(cue) {
    if (!await audioReady || !state.soundEnabled || actx.state !== 'running') return;
    if (cue === 'prompt') { tone(880, 0.16, 0, 0.28); tone(1174.6, 0.22, 0.14, 0.28); }
    else if (cue === 'tick') { tone(1500, 0.05, 0, 0.5); }
    else if (cue === 'ring') {
      for (let i = 0; i < 4; i++) { tone(988, 0.35, i * 0.5, 0.35); tone(740, 0.35, i * 0.5 + 0.22, 0.3); }
    }
    else if (cue === 'voice') { tone(659, 0.14, 0, 0.3); tone(880, 0.14, 0.16, 0.3); tone(1108.7, 0.28, 0.32, 0.3); }
    else if (cue === 'plus') { tone(587, 0.14, 0, 0.32); tone(880, 0.2, 0.14, 0.3); }
    else if (cue === 'minus') { tone(659, 0.15, 0, 0.32); tone(494, 0.18, 0.15, 0.3); tone(392, 0.26, 0.3, 0.28); }
    else if (cue === 'subMinute') { tone(659, 0.15, 0, 0.32); tone(494, 0.18, 0.15, 0.3); tone(392, 0.26, 0.3, 0.28); }
    else if (cue === 'limit') { tone(196, 0.16, 0, 0.3); tone(196, 0.16, 0.2, 0.24); }
  }
  function getMedia(cue) {
    if (!mediaSounds.has(cue)) mediaSounds.set(cue, new Audio(SOUND_FILES[cue]));
    return mediaSounds.get(cue);
  }

  function playMedia(cue) {
    try {
      const a = getMedia(cue);
      a.currentTime = 0;
      const p = a.play();
      if (p) p.catch(() => synth(cue));
    } catch {
      synth(cue);
    }
  }

  async function playSound(cue) {
    if (!state.soundEnabled) return;
    if (!useDecodedAudio || !audioReady) {
      playMedia(cue);
      return;
    }

    const context = actx;
    const previous = playingSounds.get(cue);
    const playback = { source: null };
    playingSounds.set(cue, playback);
    previous?.source?.stop();
    if (!decodedSounds.has(cue)) {
      const loading = decodeSound(context, cue).catch(() => null);
      decodedSounds.set(cue, loading);
    }
    const loading = decodedSounds.get(cue);
    const [buffer, ready] = await Promise.all([loading, audioReady]);
    if (!buffer && decodedSounds.get(cue) === loading) decodedSounds.delete(cue);
    if (playingSounds.get(cue) !== playback) return;
    if (!ready || !buffer || context.state !== 'running') {
      playingSounds.delete(cue);
      playMedia(cue);
      return;
    }

    const source = context.createBufferSource();
    playback.source = source;
    source.buffer = buffer;
    source.connect(context.destination);
    source.onended = () => {
      source.disconnect();
      if (playingSounds.get(cue) === playback) playingSounds.delete(cue);
    };
    source.start();
  }

  function stopSounds() {
    for (const playback of playingSounds.values()) playback.source?.stop();
    playingSounds.clear();
    for (const audio of mediaSounds.values()) audio.pause();
  }

  function playCue(cue) {
    if (!state.soundEnabled) return;
    if (cue === 'plus' || cue === 'minus' || cue === 'limit') { synth(cue); return; }
    playSound(cue);
  }

  /* ---------- helpers ---------- */
  function totalMs() {
    return state.durationSeconds * secondMs;
  }
  function fmtTime(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    return `${pad(m)}:${pad(sec)}`;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function clock(d) { return d ? `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` : '--:--:--'; }
  function clockHM(d) { return d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '--:--'; }
  // Smooth, rAF-driven ring animation (works well on mobile; no SVG transition jank)
  let ringValue = 1, ringTarget = 1, ringRaf = null;
  let dialFill = null, castFill = null;
  function getRings() {
    if (!dialFill) dialFill = document.querySelector('.dial .ring .fill');
    if (!castFill) castFill = document.querySelector('.cast-dial .ring .fill');
  }
  function drawRing(frac) {
    if (!dialFill) getRings();
    if (dialFill) { dialFill.style.strokeDasharray = C; dialFill.style.strokeDashoffset = C * (1 - frac); }
    if (castFill) { castFill.style.strokeDasharray = CCAST; castFill.style.strokeDashoffset = CCAST * (1 - frac); }
  }
  function updateRing(frac) {
    ringTarget = frac;
    if (!ringRaf) ringRaf = requestAnimationFrame(animateRing);
  }
  function animateRing() {
    const diff = ringTarget - ringValue;
    if (Math.abs(diff) < 0.0004) {
      ringValue = ringTarget;
      drawRing(ringValue);
      ringRaf = null;
      return;
    }
    ringValue += diff * 0.16;   // smooth ease toward target
    drawRing(ringValue);
    ringRaf = requestAnimationFrame(animateRing);
  }
  function setRing(el, total, remaining) {
    updateRing(total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 1);
  }
  function setRingCast(el, total, remaining) {
    updateRing(total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 1);
  }

  /* ---------- timer control ---------- */
  let timerId = null;
  function startInterval() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(update, 100);
  }
  function stopInterval() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function start() {
    const hasRemaining = state.endsAt !== null && state.remainingMs > 0;
    const base = hasRemaining ? state.remainingMs : totalMs();
    if (base <= 0) return;
    const now = Date.now();
    if (!hasRemaining || state.finishPlayed) state.startedAt = new Date(now);
    state.endsAt = new Date(now + base);
    state.remainingMs = base;
    state.running = true;
    state.lastTickSec = Math.ceil(base / 1000);
    state.finishPlayed = false;
    hideDone();
    playSound('prompt');
    startInterval();
    render();
  }

  function pause() {
    if (!state.running) return;
    const remaining = state.endsAt.getTime() - Date.now();
    if (remaining <= 0) {
      finish();
      return;
    }
    state.remainingMs = remaining;
    state.running = false;
    stopInterval();
    render();
  }

  function reset() {
    stopInterval();
    state.running = false;
    state.remainingMs = totalMs();
    state.startedAt = null;
    state.endsAt = null;
    state.finishPlayed = false;
    state.lastTickSec = Math.ceil(state.remainingMs / 1000);
    hideDone();
    render();
  }

  function addMinute() {
    if (state.running && state.endsAt) {
      if (state.endsAt.getTime() <= Date.now()) {
        finish();
        return false;
      }
      playSound('voice');
      state.endsAt = new Date(state.endsAt.getTime() + minuteMs);
      state.remainingMs = Math.max(state.endsAt.getTime() - Date.now(), 0);
    } else if (state.endsAt) {
      playCue('plus');
      state.remainingMs += minuteMs;
    } else {
      playCue('plus');
      setDuration(state.durationSeconds + secondsPerMinute);
      return;
    }
    hideDone();
    render();
  }

  function minusMinute() {
    if (state.running && state.endsAt) {
      const next = state.endsAt.getTime() - minuteMs;
      if (next <= Date.now()) { finish(); return; }
      state.endsAt = new Date(next);
      state.remainingMs = next - Date.now();
      playSound('subMinute');
    } else if (state.endsAt) {
      if (state.remainingMs > 0) {
        state.remainingMs = Math.max(state.remainingMs - minuteMs, 0);
        state.lastTickSec = Math.ceil(state.remainingMs / 1000);
        playCue('minus');
      } else {
        playCue('limit');
      }
    } else {
      if (state.durationSeconds > secondsPerMinute) {
        playCue('minus');
        setDuration(state.durationSeconds - secondsPerMinute);
      } else {
        playCue('limit');
      }
      return;
    }
    hideDone();
    render();
  }

  function setDuration(seconds, syncWheels = true) {
    if (state.running) return;
    state.durationSeconds = Math.max(0, Math.min(maxDuration, seconds));
    if (syncWheels) durationWheels.forEach(({ sync }) => sync());
    reset();
  }

  function update() {
    if (!state.running || !state.endsAt) return;
    const rem = Math.max(state.endsAt.getTime() - Date.now(), 0);
    state.remainingMs = rem;
    const sec = Math.ceil(rem / 1000);
    if (rem > 0 && sec > 0 && sec < state.lastTickSec) playSound('tick');
    state.lastTickSec = sec;
    if (rem <= 0) finish();
    else render();
  }

  function finish() {
    state.running = false;
    stopInterval();
    state.remainingMs = 0;
    if (!state.finishPlayed) {
      state.finishPlayed = true;
      playSound('ring');
      if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]);
      showDone();
    }
    render();
  }

  function showDone() {
    state.doneVisible = true;
    $('#castDone').classList.add('show');
    $('#castDial').classList.add('done');
    $('#castView').classList.add('done');
    requestAnimationFrame(alignDoneText);
  }
  function hideDone() {
    state.doneVisible = false;
    $('#castDone').classList.remove('show');
    $('#castDial').classList.remove('done');
    $('#castView').classList.remove('done');
  }

  /* CJK punctuation (like ！) leaves a one-sided gap, so nudge the line until the
     visible glyphs, not the text box, sit on the centre line of the screen. */
  function alignDoneText() {
    const el = document.querySelector('#castDone .big');
    if (!el) return;
    el.style.transform = 'none';
    const cs = getComputedStyle(el);
    const cv = alignDoneText._cv || (alignDoneText._cv = document.createElement('canvas'));
    const ctx = cv.getContext('2d');
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = ctx.measureText(el.textContent);
    if (!m.width || typeof m.actualBoundingBoxLeft !== 'number' || typeof m.actualBoundingBoxRight !== 'number') return;
    const inkCenter = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
    const shift = m.width / 2 - inkCenter;
    if (Math.abs(shift) > 0.5) el.style.transform = `translateX(${shift.toFixed(1)}px)`;
  }
  /* ---------- duration wheels ---------- */
  function createDurationWheel(wheel, unit, max) {
    const options = Array.from({ length: max + 1 }, (_, value) => {
      const option = document.createElement('span');
      option.className = 'duration-option';
      option.setAttribute('aria-hidden', 'true');
      option.textContent = pad(value);
      return option;
    });
    wheel.append(...options);
    wheel.setAttribute('aria-valuemax', max);
    const step = options[0].offsetHeight;
    const clamp = value => Math.max(0, Math.min(max, value));
    const current = () => Math.floor(state.durationSeconds / unit) % (max + 1);
    const scrolledValue = () => clamp(Math.round(wheel.scrollTop / step));
    let highlighted;

    function highlight(value) {
      if (value === highlighted) return;
      options[highlighted]?.classList.remove('selected');
      options[value].classList.add('selected');
      wheel.setAttribute('aria-valuenow', value);
      highlighted = value;
    }

    function sync() {
      const value = current();
      wheel.scrollTop = value * step;
      highlight(value);
    }

    wheel.addEventListener('scroll', () => {
      if (state.running || document.body.classList.contains('casting')) return;
      const value = scrolledValue();
      if (value !== current()) {
        setDuration(state.durationSeconds + (value - current()) * unit, false);
      }
      highlight(value);
    });

    let drag = null;
    wheel.addEventListener('pointerdown', (e) => {
      if (state.running || e.pointerType !== 'mouse' || e.button !== 0) return;
      wheel.focus({ preventScroll: true });
      wheel.setPointerCapture(e.pointerId);
      drag = { y: e.clientY, top: wheel.scrollTop };
      wheel.classList.add('dragging');
    });
    wheel.addEventListener('pointermove', (e) => {
      if (drag && !state.running) wheel.scrollTop = drag.top + drag.y - e.clientY;
    });
    wheel.addEventListener('lostpointercapture', () => {
      if (!drag) return;
      const value = scrolledValue();
      drag = null;
      wheel.classList.remove('dragging');
      wheel.scrollTop = value * step;
    });

    const keyOffsets = { ArrowUp: 1, ArrowDown: -1, PageUp: 10, PageDown: -10, Home: -max, End: max };
    wheel.addEventListener('keydown', (e) => {
      const offset = keyOffsets[e.key];
      if (!Number.isFinite(offset) || state.running) return;
      e.preventDefault();
      const value = current();
      const next = clamp(value + offset);
      if (next !== value) setDuration(state.durationSeconds + (next - value) * unit);
    });

    return { wheel, sync };
  }

  /* ---------- render ---------- */
  let lastFitKey = '';
  function fitCastTime() {
    const dial = $('#castDial');
    const time = $('#castTime');
    if (!dial || !time) return;
    const dw = dial.clientWidth;
    const dh = dial.clientHeight;
    if (dw <= 0 || dh <= 0) return;
    const key = time.textContent.length + ':' + Math.round(dw) + ':' + Math.round(dh);
    if (key === lastFitKey) return;
    lastFitKey = key;
    // measure against a provisional font, then scale to fit the ring interior
    const base = dw * 0.32;
    time.style.fontSize = base + 'px';
    const w = time.getBoundingClientRect().width;
    if (w <= 0) return;
    let fs = base * (dw * 0.8) / w;
    fs = Math.min(fs, dh * 0.36);
    time.style.fontSize = fs.toFixed(1) + 'px';
  }

  function render() {
    const total = totalMs();
    const rem = state.remainingMs;

    // normal: preset highlight
    document.querySelectorAll('.preset').forEach((btn) => {
      const sel = Number(btn.dataset.min) * secondsPerMinute === state.durationSeconds;
      btn.classList.toggle('selected', sel);
      btn.disabled = state.running;
    });

    const wheelsDisabled = String(state.running);
    durationWheels.forEach(({ wheel, sync }) => {
      if (wheel.getAttribute('aria-disabled') === wheelsDisabled) return;
      wheel.setAttribute('aria-disabled', wheelsDisabled);
      wheel.tabIndex = state.running ? -1 : 0;
      sync();
    });
    const startDisabled = total === 0;
    $('#mainBtn').disabled = startDisabled;
    $('#castMain').disabled = startDisabled;
    $('#timeText').textContent = fmtTime(rem);
    $('#startInfo').textContent = clock(state.startedAt);
    $('#endInfo').textContent = clock(state.endsAt);
    $('#mainLabel').textContent = state.running ? '暂停' : '开始计时';
    $('#mainBtn').querySelector('.icon').textContent = state.running ? '⏸' : '▶';
    $('#dial').classList.toggle('running', state.running);
    $('#soundBtn').textContent = state.soundEnabled ? '🔊' : '🔇';
    $('#soundBtn').setAttribute('aria-pressed', state.soundEnabled);
    setRing($('#dial'), total, rem);

    // cast
    $('#castTime').textContent = fmtTime(rem);
    $('#castStatus').textContent = state.running ? '进行中' : (state.endsAt ? (rem <= 0 ? '已结束' : '已暂停') : '准备');
    $('#castMainLabel').textContent = state.running ? '暂停' : '开始';
    $('#castMain').querySelector('.ic').textContent = state.running ? '⏸' : '▶';
    $('#castDial').classList.toggle('running', state.running);
    $('#castSound').innerHTML = (state.soundEnabled ? '🔊' : '🔇') + ' 声音';
    setRingCast($('#castDial'), total, rem);
    $('#castMeta').innerHTML = `开始 <b>${clockHM(state.startedAt)}</b> · 结束 <b>${clockHM(state.endsAt)}</b>`;
    fitCastTime();
    remote?.sync();
  }

  function readRemoteTimer() {
    const deadline = state.running ? state.endsAt.getTime() : null;
    const remainingMs = deadline === null ? state.remainingMs : Math.max(0, deadline - Date.now());
    return {
      deadline,
      remainingMs,
      durationMs: totalMs(),
      phase: state.running ? 'running' : state.endsAt ? (remainingMs > 0 ? 'paused' : 'finished') : 'ready',
      canSubtract: state.endsAt ? remainingMs > 0 : state.durationSeconds > secondsPerMinute,
    };
  }

  function applyRemoteCommand(action) {
    if (action === 'add') return addMinute() !== false;
    if (state.running && state.endsAt.getTime() <= Date.now()) {
      finish();
      return false;
    }
    if (action === 'start' && !state.running && totalMs() > 0) start();
    else if (action === 'pause' && state.running) pause();
    else if (action === 'subtract' && readRemoteTimer().canSubtract) minusMinute();
    else return false;
    return true;
  }

  /* ---------- mode toggling ---------- */
  function enterCast() {
    document.body.classList.add('casting');
    render();
    requestFullscreen();
  }
  function exitCast() {
    document.body.classList.remove('casting');
    durationWheels.forEach(({ sync }) => sync());
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  function requestFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else requestFullscreen();
  }
  function onFsChange() {
    const prompt = $('#fullscreenPrompt');
    if (document.fullscreenElement) {
      prompt.style.display = 'none';
    } else {
      // show hint only when casting and not fullscreen
      prompt.style.display = document.body.classList.contains('casting') ? 'block' : 'none';
    }
  }

  /* ---------- events ---------- */
  $('#castToggle').addEventListener('click', enterCast);
  $('#castEntry').addEventListener('click', enterCast);
  $('#dial').addEventListener('click', enterCast);
  $('#dial').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterCast(); }
  });
  $('#castExit').addEventListener('click', exitCast);
  $('#castFullscreen').addEventListener('click', toggleFullscreen);

  $('#mainBtn').addEventListener('click', () => (state.running ? pause() : start()));
  $('#resetBtn').addEventListener('click', reset);
  $('#addBtn').addEventListener('click', addMinute);
  $('#minusBtn').addEventListener('click', minusMinute);

  $('#castMain').addEventListener('click', () => (state.running ? pause() : start()));
  $('#castReset').addEventListener('click', reset);
  $('#castAdd').addEventListener('click', addMinute);
  $('#castMinus').addEventListener('click', minusMinute);
  $('#castSound').addEventListener('click', toggleSound);
  $('#soundBtn').addEventListener('click', toggleSound);

  function toggleSound() {
    state.soundEnabled = !state.soundEnabled;
    if (state.soundEnabled) unlockAudio();
    else stopSounds();
    render();
  }

  document.querySelectorAll('.preset').forEach((btn) => {
    btn.addEventListener('click', () => setDuration(Number(btn.dataset.min) * secondsPerMinute));
  });

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || document.querySelector('dialog[open]') ||
      e.target.closest('button, input, textarea, select') || e.target.isContentEditable) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); state.running ? pause() : start(); }
    else if (k === 'r') reset();
    else if (k === '+') addMinute();
    else if (k === '-') minusMinute();
    else if (k === 'm') toggleSound();
    else if (k === 'f') toggleFullscreen();
    else if (k === 'escape' && document.body.classList.contains('casting')) exitCast();
  });

  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // resume accurate remaining time when tab comes back
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (actx && actx.state !== 'running') unlockAudio();
    if (state.running && state.endsAt) update();
  });

  /* ---------- lock gestures on touch devices ----------
     `user-scalable=no` is ignored by iOS Safari, and touch-action alone is not
     enough on older WebKit, so the pinch gestures are cancelled explicitly. ---------- */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => {
    document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();   // two fingers = pinch, never pan
  }, { passive: false });
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  window.addEventListener('resize', () => {
    lastFitKey = '';
    fitCastTime();
    if (state.doneVisible) alignDoneText();
  });

  // init
  const durationWheels = [
    createDurationWheel($('#minuteWheel'), secondsPerMinute, maxMinutes),
    createDurationWheel($('#secondWheel'), 1, secondsPerMinute - 1),
  ];
  loadSounds();
  setRing($('#dial'), totalMs(), state.remainingMs);
  setRingCast($('#castDial'), totalMs(), state.remainingMs);
  render();
  document.addEventListener('DOMContentLoaded', () => {
    remote = window.setupTimerRemote?.({ version: 2, readTimer: readRemoteTimer, applyCommand: applyRemoteCommand });
  });
})();
</script>
</body>
</html>
